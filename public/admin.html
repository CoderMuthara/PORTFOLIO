<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin</title>
</head>

<body>
  <!-- Shown when logged out -->
  <div id="login-section">
    <h1>Admin Login</h1>
    <form id="login-form">
      <input type="text" id="username" placeholder="Username" required>
      <input type="password" id="password" placeholder="Password" required>
      <button type="submit">Log in</button>
      <p id="login-status"></p>
    </form>
  </div>

  <!-- Shown when logged in -->
  <div id="dashboard-section" hidden>
    <h1>Dashboard</h1>
    <button id="logout-btn">Log out</button>

    <h2 id="form-title">Add a project</h2>
    <form id="project-form">
      <input type="hidden" id="project-id">
      <input type="text" id="title" placeholder="Title" required>
      <textarea id="description" placeholder="Description" rows="3" required></textarea>
      <input type="text" id="tech" placeholder="Tech used (e.g. Node.js, Express)" required>
      <input type="url" id="live_url" placeholder="Live link (https://...)">
      <input type="url" id="code_url" placeholder="GitHub link (https://...)">
      <button type="submit" id="save-btn">Add project</button>
      <button type="button" id="cancel-btn" hidden>Cancel edit</button>
      <p id="project-status"></p>
    </form>

    <h2>Your projects</h2>
    <div id="project-list"></div>
  </div>

  <script src="js/admin.js"></script>
</body>

</html>
